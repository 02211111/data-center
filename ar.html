<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body { margin: 0; font-family: system-ui; }
.bar {
  position: fixed;
  top: 8px;
  left: 8px;
  right: 8px;
  z-index: 9999;
  background: #10283de8;
  color: white;
  border-radius: 9px;
  padding: 12px;
  font-size: 14px;
}
.bar a { color: #82eaff; }
.bar small { display: block; margin-top: 5px; }
.bar button {
  background: #15576b;
  color: white;
  border: 1px solid #65bdd0;
  border-radius: 6px;
  padding: 6px 10px;
  margin-right: 6px;
  margin-top: 7px;
  cursor: pointer;
  font-size: 13px;
}
.bar button:hover { background: #1c6f88; }
</style>
</head>
<body>

<!-- ===== MENÚ SUPERIOR ===== -->
<div class="bar">
  <b>Centro de Datos | Realidad Aumentada</b>
  <a href="index.html" style="margin-left:10px">Volver a VR</a>
  <div style="margin-top:7px">
    <button onclick="tipoAR('rack')">Servidores (Rack)</button>
    <button onclick="tipoAR('router')">Router WiFi</button>
    <button onclick="tipoAR('desk')">Escritorio</button>
  </div>
  <small>Autorice la cámara y apunte al marcador imagen.jpg impreso. Use HTTPS en Android. Si no reconoce la imagen, revise luz y distancia (30–50 cm).</small>
</div>

<!-- ===== ESCENA AR ===== -->
<a-scene mindar-image="imageTargetSrc: targets.mind;"
  renderer="colorManagement: true" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- Usamos tus propios modelos de la carpeta models/ -->
    <a-asset-item id="modelo-rack"       src="models/server_racking_system.glb"></a-asset-item>
    <a-asset-item id="modelo-router"     src="models/wifi_router.glb"></a-asset-item>
    <a-asset-item id="modelo-escritorio" src="models/escritorio.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- 1. SERVIDORES (Usando tu modelo de Rack) -->
    <a-entity id="ar-rack">
      <a-gltf-model src="#modelo-rack"
                    position="0 -0.1 0.1"
                    scale="0.3 0.3 0.3"
                    rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- 2. ROUTER (oculto por defecto) -->
    <a-entity id="ar-router" visible="false">
      <a-gltf-model src="#modelo-router"
                    position="0 -0.1 0.1"
                    scale="1.5 1.5 1.5"
                    rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- 3. ESCRITORIO (oculto por defecto) -->
    <a-entity id="ar-desk" visible="false">
      <a-gltf-model src="#modelo-escritorio"
                    position="0 -0.03 0.1"
                    scale="0.3 0.3 0.3"
                    rotation="0 180 0"></a-gltf-model>
    </a-entity>

    <!-- PANEL DE ESTADO INFERIOR -->
    <a-plane width="1.1" height="0.28" color="#071c2b" opacity="0.9"
             position="0 0.47 0.12"></a-plane>
    <a-text id="ar-estado" value="RACK DE SERVIDORES | ACTIVO"
            align="center" width="1.8" color="#6dffb5"
            position="0 0.47 0.14"></a-text>
  </a-entity>

</a-scene>

<!-- ===== LÓGICA DE CAMBIO DE MODELO ===== -->
<script>
function tipoAR(tipo) {
  // Mapeamos los botones a los IDs de las entidades
  const ids = { rack: 'ar-rack', router: 'ar-router', desk: 'ar-desk' };
  
  // Ocultamos todos y mostramos solo el seleccionado
  Object.keys(ids).forEach(function (k) {
    document.getElementById(ids[k]).setAttribute('visible', k === tipo);
  });
  
  // Actualizamos el texto del panel inferior
  const txt = {
    rack:    'RACK DE SERVIDORES | ACTIVO',
    router:  'ROUTER WIFI | ACTIVO',
    desk:    'PUESTO TECNICO'
  };
  document.querySelector('#ar-estado').setAttribute('value', txt[tipo]);
}
</script>

</body>
</html>
